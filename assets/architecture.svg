<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">Kiddo Programmer architecture</title>
  <desc id="description">A child uses an iPad on the home network. Kiddo Programmer runs on a Raspberry Pi, where a build, check, review, and publish loop saves approved apps and Git history. Worker and supervisor agents use the adult's external AI account.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#56627a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#7256d8"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#26324b" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: Inter, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243149; }
      .heading { font-size: 25px; font-weight: 750; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 500; }
      .small { font-size: 13px; font-weight: 600; fill: #5f6b80; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="26" fill="#fbfcff"/>
  <text x="600" y="42" text-anchor="middle" class="heading">A safe creative loop, running from home</text>
  <rect x="24" y="66" width="876" height="548" rx="28" fill="#eef8ff" stroke="#b9ddf2" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="52" y="48" width="192" height="34" rx="17" fill="#d5efff"/>
  <text x="148" y="70" text-anchor="middle" class="small" fill="#2d6688">YOUR HOME NETWORK</text>

  <g filter="url(#shadow)">
    <rect x="58" y="177" width="220" height="285" rx="28" fill="#ffffff" stroke="#74b9df" stroke-width="3"/>
    <circle cx="168" cy="193" r="4" fill="#74b9df"/>
    <rect x="76" y="211" width="184" height="216" rx="12" fill="#f2f8ff"/>
    <rect x="89" y="225" width="77" height="126" rx="8" fill="#dff4e8"/>
    <circle cx="127" cy="275" r="22" fill="#8addad"/>
    <path d="M112 285 Q127 297 142 285" fill="none" stroke="#28734b" stroke-width="4" stroke-linecap="round"/>
    <rect x="176" y="225" width="71" height="126" rx="8" fill="#eee8ff"/>
    <rect x="185" y="242" width="49" height="10" rx="5" fill="#9b86e5"/>
    <rect x="191" y="264" width="43" height="9" rx="4.5" fill="#c4b8ef"/>
    <rect x="185" y="286" width="55" height="9" rx="4.5" fill="#c4b8ef"/>
    <rect x="89" y="367" width="158" height="45" rx="12" fill="#ffffff" stroke="#cbd9e7"/>
    <text x="105" y="395" class="small">Type an idea…</text>
    <circle cx="168" cy="444" r="6" fill="#9bb8ca"/>
  </g>
  <text x="168" y="493" text-anchor="middle" class="label">Kid's iPad</text>
  <text x="168" y="518" text-anchor="middle" class="body">Preview + friendly chat</text>
  <text x="168" y="541" text-anchor="middle" class="small">Nothing to install</text>

  <path d="M285 315 H354" fill="none" stroke="#56627a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M354 337 H285" fill="none" stroke="#56627a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="320" y="298" text-anchor="middle" class="small">Wi-Fi</text>

  <g filter="url(#shadow)"><rect x="365" y="103" width="500" height="474" rx="28" fill="#ffffff" stroke="#8a75dd" stroke-width="3"/></g>
  <circle cx="397" cy="132" r="10" fill="#80d5a5"/>
  <text x="420" y="140" class="heading">Your Raspberry Pi</text>
  <text x="420" y="166" class="body">Kiddo Programmer runs here</text>
  <rect x="399" y="192" width="432" height="68" rx="16" fill="#eeeaff"/>
  <text x="615" y="221" text-anchor="middle" class="label">Local Kiddo web server</text>
  <text x="615" y="244" text-anchor="middle" class="small">Projects • chat • previews</text>

  <text x="399" y="299" class="small">EVERY REQUEST</text>
  <rect x="399" y="317" width="92" height="62" rx="14" fill="#fff0cf" stroke="#e5bd5c"/>
  <text x="445" y="354" text-anchor="middle" class="label">Build</text>
  <path d="M496 348 H518" stroke="#56627a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="525" y="317" width="92" height="62" rx="14" fill="#e1f5e9" stroke="#70bc91"/>
  <text x="571" y="354" text-anchor="middle" class="label">Check</text>
  <path d="M622 348 H644" stroke="#56627a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="651" y="317" width="92" height="62" rx="14" fill="#eeeaff" stroke="#9c88e4"/>
  <text x="697" y="354" text-anchor="middle" class="label">Review</text>
  <path d="M748 348 H770" stroke="#56627a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="777" y="317" width="54" height="62" rx="14" fill="#dff3ff" stroke="#75b9dc"/>
  <path d="M792 348 L801 357 L818 338" fill="none" stroke="#28759b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="804" y="399" text-anchor="middle" class="small">PUBLISH</text>
  <path d="M697 385 C697 418 445 418 445 385" fill="none" stroke="#7256d8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/>
  <text x="571" y="435" text-anchor="middle" class="small" fill="#7256d8">Fix and retry when needed</text>
  <path d="M804 383 C804 438 758 438 740 456" fill="none" stroke="#56627a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="470" y="463" width="290" height="82" rx="18" fill="#f4f7fb" stroke="#aab7ca"/>
  <ellipse cx="508" cy="486" rx="22" ry="9" fill="#c5d2e2"/>
  <path d="M486 486 V516 C486 528 530 528 530 516 V486" fill="#dce5ef" stroke="#9aaac0"/>
  <ellipse cx="508" cy="516" rx="22" ry="9" fill="#dce5ef" stroke="#9aaac0"/>
  <text x="550" y="495" class="label">Local projects</text>
  <text x="550" y="520" class="small">Apps + Git history</text>

  <g filter="url(#shadow)"><rect x="940" y="177" width="224" height="285" rx="28" fill="#fffaf0" stroke="#e7bd64" stroke-width="3"/></g>
  <path d="M1000 251 C986 251 978 241 978 229 C978 216 989 206 1003 207 C1009 191 1025 181 1043 185 C1058 187 1070 199 1072 214 C1086 214 1097 224 1097 237 C1097 250 1087 260 1073 260 H1000 Z" fill="#ffe2a5" stroke="#d5a348" stroke-width="2"/>
  <text x="1052" y="302" text-anchor="middle" class="label">Your AI account</text>
  <text x="1052" y="329" text-anchor="middle" class="body">AI coding model</text>
  <text x="1052" y="365" text-anchor="middle" class="small">Used by the local worker</text>
  <text x="1052" y="386" text-anchor="middle" class="small">and supervisor</text>
  <text x="1052" y="425" text-anchor="middle" class="small">Adult's subscription</text>

  <path d="M865 285 C900 285 912 285 934 285" fill="none" stroke="#c58e32" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <path d="M934 316 C910 316 898 316 865 316" fill="none" stroke="#c58e32" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="900" y="263" text-anchor="middle" class="small">coding</text>
  <text x="900" y="337" text-anchor="middle" class="small">results</text>

  <text x="600" y="606" text-anchor="middle" class="small">The framework and project data stay on the Pi. Only coding requests go to the chosen AI provider.</text>
</svg>
